<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 Secure Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 27, 43, 0.95);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 98vh;
            display: flex;
            flex-direction: column;
        }
        header {
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        header h1 {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px;
        }
        header p {
            color: #8892b0;
            font-size: 13px;
        }
        .screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }
        .screen.active {
            display: flex;
        }
        .setup-section {
            background: rgba(26, 35, 50, 0.8);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .setup-section h2 {
            color: #00d4ff;
            font-size: 17px;
            margin-bottom: 4px;
        }
        .setup-section .hint {
            color: #8892b0;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .divider {
            text-align: center;
            color: #8892b0;
            margin: 12px 0;
            position: relative;
        }
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }
        .divider::before {
            left: 0;
        }
        .divider::after {
            right: 0;
        }
        .divider span {
            background: #141b2b;
            padding: 0 12px;
            font-size: 13px;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            background: rgba(13, 20, 33, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 14px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .input-field:focus {
            border-color: #00d4ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e17;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: rgba(35, 48, 68, 0.8);
            color: #e0e0e0;
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(45, 62, 90, 0.8);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }
        .btn-danger:hover {
            background: rgba(255, 68, 68, 0.3);
        }
        .btn-small {
            padding: 4px 10px;
            background: rgba(35, 48, 68, 0.8);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-small:hover {
            background: rgba(45, 62, 90, 0.8);
        }
        .btn-success {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .btn-success:hover {
            background: rgba(0, 255, 136, 0.25);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(13, 20, 33, 0.5);
            border-radius: 8px;
            font-size: 11px;
            color: #8892b0;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .chat-header {
            background: rgba(26, 35, 50, 0.8);
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chat-header .chat-title {
            font-size: 16px;
            font-weight: 600;
        }
        .chat-header .chat-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-header .online-count {
            font-size: 12px;
            color: #00ff88;
            font-weight: 400;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            background: rgba(13, 20, 33, 0.5);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            min-height: 200px;
        }
        .system-message {
            text-align: center;
            color: #8892b0;
            font-size: 12px;
            padding: 8px;
            opacity: 0.7;
        }
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            font-size: 14px;
        }
        .message.own {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #0a0e17;
            margin-left: auto;
        }
        .message.other {
            background: rgba(26, 35, 50, 0.8);
            color: #e0e0e0;
        }
        .message.private {
            border-left: 3px solid #ffaa00;
        }
        .message .sender-name {
            display: block;
            font-size: 10px;
            margin-bottom: 3px;
            opacity: 0.7;
        }
        .message .timestamp {
            display: block;
            font-size: 9px;
            opacity: 0.5;
            margin-top: 3px;
        }
        .message .private-badge {
            font-size: 9px;
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 4px;
        }
        .message .file-attachment {
            display: inline-block;
            margin-top: 4px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }
        .message .file-attachment:hover {
            background: rgba(0, 0, 0, 0.35);
            transform: scale(1.02);
        }
        .message .file-attachment .file-icon {
            margin-right: 8px;
            font-size: 18px;
        }
        .message .file-attachment .file-name {
            font-weight: 500;
        }
        .message .file-attachment .file-size {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 6px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .input-area .input-field {
            flex: 1;
            margin-bottom: 0;
            min-width: 120px;
        }
        .input-area .action-buttons {
            display: flex;
            gap: 4px;
        }
        .input-area .action-buttons .btn {
            padding: 8px 12px;
            font-size: 16px;
        }
        .input-area .private-toggle {
            padding: 8px 12px;
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid rgba(255, 170, 0, 0.2);
            border-radius: 8px;
            color: #ffaa00;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .input-area .private-toggle.active {
            background: rgba(255, 170, 0, 0.2);
            border-color: #ffaa00;
        }
        .typing-indicator {
            color: #8892b0;
            font-size: 11px;
            padding: 4px 12px;
            font-style: italic;
            min-height: 20px;
        }
        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px 0;
        }
        .user-chip {
            padding: 2px 10px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-chip .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
        }
        .file-progress {
            background: rgba(13, 20, 33, 0.8);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .file-progress .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .file-progress .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            transition: width 0.3s;
            width: 0%;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .messages-area::-webkit-scrollbar {
            width: 4px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: rgba(13, 20, 33, 0.5);
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: rgba(35, 48, 68, 0.8);
            border-radius: 2px;
        }
        .connection-status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .connection-status.connected {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
        }
        .connection-status.disconnected {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
        }
        .connection-status.connecting {
            background: rgba(255, 170, 0, 0.1);
            color: #ffaa00;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .room-info {
            font-size: 11px;
            color: #8892b0;
            padding: 4px 0;
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }
        .room-info code {
            background: rgba(13, 20, 33, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: #00d4ff;
            word-break: break-all;
        }
        #file-input {
            display: none;
        }
        @media (max-width: 768px) {
            .container {
                padding: 12px;
                max-height: 100vh;
            }
            .message {
                max-width: 90%;
                font-size: 13px;
            }
            .chat-header .chat-title {
                font-size: 14px;
            }
            .input-area .private-toggle {
                font-size: 10px;
                padding: 6px 8px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💬 Secure Chat</h1>
            <p>End-to-end encrypted · File sharing · Private messages</p>
        </header>

        <!-- SETUP SCREEN -->
        <div id="setup-screen" class="screen active">
            <div class="setup-section">
                <h2>🚀 Create a Room</h2>
                <p class="hint">Start a new chat room</p>
                <input type="text" id="create-username" placeholder="Your name..." class="input-field">
                <button id="create-room" class="btn btn-primary">Create Room</button>
            </div>
            <div class="divider"><span>or</span></div>
            <div class="setup-section">
                <h2>🔗 Join a Room</h2>
                <p class="hint">Enter the room details from your friend</p>
                <input type="text" id="join-room-id" placeholder="Room ID" class="input-field">
                <input type="text" id="join-username" placeholder="Your name..." class="input-field">
                <button id="join-room" class="btn btn-secondary">Join Room</button>
            </div>
            <div class="status-bar">
                <span id="connection-status">⚪ Disconnected</span>
                <span id="server-status">Server: Not connected</span>
            </div>
        </div>

        <!-- CHAT SCREEN -->
        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <div>
                    <div class="chat-title" id="chat-title">💬 Room</div>
                    <div class="user-list" id="user-list"></div>
                </div>
                <div class="chat-actions">
                    <span class="connection-status disconnected" id="conn-status">⚪</span>
                    <button class="btn-small btn-danger" id="leave-btn">🚪 Leave</button>
                </div>
            </div>

            <div id="messages" class="messages-area">
                <div class="system-message">🔒 Waiting for messages...</div>
            </div>

            <div class="typing-indicator" id="typing-indicator"></div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." class="input-field" disabled>
                <button class="private-toggle" id="private-toggle">🔒</button>
                <div class="action-buttons">
                    <button id="file-btn" class="btn btn-secondary" disabled title="Send file">📎</button>
                    <button id="send-btn" class="btn btn-primary" disabled>Send</button>
                </div>
            </div>
            <input type="file" id="file-input" multiple>
        </div>
    </div>

    <script>
        // ============================================================
        //  ENCRYPTION
        // ============================================================
        class ChatEncryption {
            constructor() {
                this.key = null;
                this.encoder = new TextEncoder();
                this.decoder = new TextDecoder();
            }

            async generateKey() {
                this.key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
                return this.key;
            }

            async exportKey() {
                const exported = await crypto.subtle.exportKey("raw", this.key);
                return btoa(String.fromCharCode(...new Uint8Array(exported)));
            }

            async importKey(base64Key) {
                const keyData = Uint8Array.from(atob(base64Key), c => c.charCodeAt(0));
                this.key = await crypto.subtle.importKey("raw", keyData, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
                return this.key;
            }

            async encrypt(message) {
                if (!this.key || typeof message !== 'string') return message;
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encoded = this.encoder.encode(message);
                const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, this.key, encoded);
                const result = new Uint8Array(iv.length + encrypted.byteLength);
                result.set(iv, 0);
                result.set(new Uint8Array(encrypted), iv.length);
                return btoa(String.fromCharCode(...result));
            }

            async decrypt(encryptedBase64) {
                if (!this.key || typeof encryptedBase64 !== 'string') return encryptedBase64;
                try {
                    const encrypted = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
                    const iv = encrypted.slice(0, 12);
                    const data = encrypted.slice(12);
                    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, this.key, data);
                    return this.decoder.decode(decrypted);
                } catch (e) {
                    return encryptedBase64;
                }
            }

            async encryptFile(file) {
                const chunks = [];
                const chunkSize = 64 * 1024;
                const iv = crypto.getRandomValues(new Uint8Array(12));
                let offset = 0;

                while (offset < file.size) {
                    const chunk = file.slice(offset, offset + chunkSize);
                    const arrayBuffer = await chunk.arrayBuffer();
                    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, this.key, arrayBuffer);
                    chunks.push(new Uint8Array(encrypted));
                    offset += chunkSize;
                }

                const totalLength = iv.length + chunks.reduce((sum, chunk) => sum + chunk.length, 0);
                const result = new Uint8Array(totalLength);
                result.set(iv, 0);
                let position = iv.length;
                for (const chunk of chunks) {
                    result.set(chunk, position);
                    position += chunk.length;
                }
                return result.buffer;
            }

            async decryptFile(encryptedData) {
                const data = new Uint8Array(encryptedData);
                const iv = data.slice(0, 12);
                const encryptedContent = data.slice(12);
                return await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, this.key, encryptedContent);
            }
        }

        // ============================================================
        //  CHAT CLIENT - FIXED DUPLICATE ISSUE
        // ============================================================
        class SecureChat {
            constructor(serverUrl) {
                this.serverUrl = serverUrl;
                this.ws = null;
                this.username = null;
                this.roomId = null;
                this.encryption = new ChatEncryption();
                this.isConnected = false;
                this.messageHistory = [];
                this.processedIds = new Set(); // Track processed message IDs
                this.onMessage = null;
                this.onUserUpdate = null;
                this.onConnectionChange = null;
                this.onTyping = null;
                this.typingTimeout = null;
            }

            async createRoom(username) {
                this.username = username;
                this.roomId = this.generateRoomId();
                await this.encryption.generateKey();
                const key = await this.encryption.exportKey();
                await this.connect();
                this.ws.send(JSON.stringify({
                    type: 'register',
                    roomId: this.roomId,
                    username: username,
                    encryptionKey: key
                }));
                return { roomId: this.roomId, encryptionKey: key };
            }

            async joinRoom(roomId, username, encryptionKey) {
                this.username = username;
                this.roomId = roomId;
                await this.encryption.importKey(encryptionKey);
                await this.connect();
                this.ws.send(JSON.stringify({
                    type: 'register',
                    roomId: roomId,
                    username: username,
                    encryptionKey: encryptionKey
                }));
            }

            generateRoomId() {
                return Math.random().toString(36).substring(2, 10).toUpperCase();
            }

            generateMessageId() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 6);
            }

            async connect() {
                return new Promise((resolve, reject) => {
                    this.ws = new WebSocket(this.serverUrl);

                    this.ws.onopen = () => {
                        this.isConnected = true;
                        if (this.onConnectionChange) this.onConnectionChange(true);
                        resolve();
                    };

                    this.ws.onmessage = async (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            await this.handleMessage(data);
                        } catch (e) {
                            console.error('Message error:', e);
                        }
                    };

                    this.ws.onclose = () => {
                        this.isConnected = false;
                        if (this.onConnectionChange) this.onConnectionChange(false);
                        setTimeout(() => {
                            if (this.roomId && this.username) {
                                this.connect().catch(() => {});
                            }
                        }, 3000);
                    };

                    this.ws.onerror = () => {
                        reject(new Error('Connection failed'));
                    };

                    setTimeout(() => {
                        if (!this.isConnected) {
                            reject(new Error('Timeout'));
                        }
                    }, 10000);
                });
            }

            async handleMessage(data) {
                switch (data.type) {
                    case 'history':
                        for (const msg of data.messages) {
                            // Skip if already processed
                            if (this.processedIds.has(msg.id)) continue;
                            this.processedIds.add(msg.id);
                            
                            // Skip if it's our own message (already shown optimistically)
                            if (msg.sender === this.username) continue;
                            
                            const decrypted = await this.encryption.decrypt(msg.message);
                            msg.message = decrypted;
                            if (this.onMessage) {
                                this.onMessage(msg, false);
                            }
                        }
                        break;

                    case 'message':
                        // Skip if already processed
                        if (this.processedIds.has(data.message.id)) break;
                        this.processedIds.add(data.message.id);
                        
                        // Skip if it's our own message (already shown optimistically)
                        if (data.message.sender === this.username) break;
                        
                        const decrypted = await this.encryption.decrypt(data.message.message);
                        data.message.message = decrypted;
                        if (this.onMessage) {
                            this.onMessage(data.message, false);
                        }
                        break;

                    case 'private-message':
                        if (this.processedIds.has(data.message.id)) break;
                        this.processedIds.add(data.message.id);
                        
                        if (data.message.sender === this.username) break;
                        
                        const pDecrypted = await this.encryption.decrypt(data.message.message);
                        data.message.message = pDecrypted;
                        data.message.isPrivate = true;
                        if (this.onMessage) {
                            this.onMessage(data.message, false);
                        }
                        break;

                    case 'file':
                        if (this.processedIds.has(data.message.id)) break;
                        this.processedIds.add(data.message.id);
                        
                        if (data.message.sender === this.username) break;
                        
                        data.message.isFile = true;
                        if (this.onMessage) {
                            this.onMessage(data.message, false);
                        }
                        break;

                    case 'user-joined':
                        if (this.onUserUpdate) {
                            this.onUserUpdate(data.users);
                        }
                        break;

                    case 'user-left':
                        if (this.onUserUpdate) {
                            this.onUserUpdate(data.users);
                        }
                        break;

                    case 'typing':
                        if (this.onTyping) {
                            this.onTyping(data.username, data.isTyping);
                        }
                        break;

                    case 'pong':
                        break;

                    default:
                        console.log('Unknown message type:', data.type);
                }
            }

            async sendMessage(text, isPrivate = false, targetUser = null) {
                if (!text.trim()) return;

                const id = this.generateMessageId();
                const encrypted = await this.encryption.encrypt(text);
                
                this.ws.send(JSON.stringify({
                    type: 'message',
                    message: encrypted,
                    isPrivate: isPrivate,
                    targetUser: targetUser,
                    id: id
                }));

                // Show message optimistically (only for the sender)
                const msg = {
                    id: id,
                    sender: this.username,
                    message: text,
                    timestamp: Date.now(),
                    isPrivate: isPrivate,
                    targetUser: targetUser
                };
                this.processedIds.add(id);
                if (this.onMessage) {
                    this.onMessage(msg, true);
                }
            }

            async sendFile(file, isPrivate = false, targetUser = null) {
                const id = this.generateMessageId();
                const fileName = file.name;
                const fileSize = file.size;
                const fileType = file.type || 'application/octet-stream';

                // Read and encrypt file
                const encryptedData = await this.encryption.encryptFile(file);
                
                // Convert to base64 for transmission
                const uint8Array = new Uint8Array(encryptedData);
                let binary = '';
                for (let i = 0; i < uint8Array.length; i++) {
                    binary += String.fromCharCode(uint8Array[i]);
                }
                const base64Data = btoa(binary);

                // Send file metadata + data
                this.ws.send(JSON.stringify({
                    type: 'file',
                    id: id,
                    fileName: fileName,
                    fileSize: fileSize,
                    fileType: fileType,
                    fileData: base64Data,
                    isPrivate: isPrivate,
                    targetUser: targetUser
                }));

                // Show file message optimistically (only for the sender)
                const msg = {
                    id: id,
                    sender: this.username,
                    fileName: fileName,
                    fileSize: fileSize,
                    fileType: fileType,
                    fileData: base64Data,
                    timestamp: Date.now(),
                    isPrivate: isPrivate,
                    targetUser: targetUser,
                    isFile: true
                };
                this.processedIds.add(id);
                if (this.onMessage) {
                    this.onMessage(msg, true);
                }
            }

            async downloadFile(fileData) {
                try {
                    const binaryString = atob(fileData.fileData);
                    const bytes = new Uint8Array(binaryString.length);
                    for (let i = 0; i < binaryString.length; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }
                    const decrypted = await this.encryption.decryptFile(bytes.buffer);
                    const blob = new Blob([decrypted], { type: fileData.fileType || 'application/octet-stream' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileData.fileName || 'download';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (e) {
                    console.error('Download error:', e);
                    alert('Failed to download file: ' + e.message);
                }
            }

            sendTyping(isTyping) {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
                this.ws.send(JSON.stringify({
                    type: 'typing',
                    isTyping: isTyping
                }));
            }

            leave() {
                if (this.ws) {
                    try {
                        this.ws.send(JSON.stringify({ type: 'leave' }));
                        this.ws.close();
                    } catch (e) {}
                }
                this.isConnected = false;
                this.username = null;
                this.roomId = null;
                this.processedIds.clear();
            }
        }

        // ============================================================
        //  UI CONTROLLER
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const defaultUsername = 'User_' + Math.random().toString(36).substring(2, 6);
            document.getElementById('create-username').value = defaultUsername;

            const serverUrl = 'wss://chasedavision.onrender.com';
            const chat = new SecureChat(serverUrl);

            const setupScreen = document.getElementById('setup-screen');
            const chatScreen = document.getElementById('chat-screen');
            const messagesDiv = document.getElementById('messages');
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            const createBtn = document.getElementById('create-room');
            const joinBtn = document.getElementById('join-room');
            const leaveBtn = document.getElementById('leave-btn');
            const fileBtn = document.getElementById('file-btn');
            const fileInput = document.getElementById('file-input');
            const privateToggle = document.getElementById('private-toggle');
            const connStatus = document.getElementById('conn-status');
            const userList = document.getElementById('user-list');
            const typingIndicator = document.getElementById('typing-indicator');

            let isPrivateMode = false;
            let privateTarget = null;
            let users = [];

            // ---- CHAT CALLBACKS ----
            chat.onMessage = (msg, isOwn) => {
                // Check if this is a file message
                if (msg.isFile || msg.fileData) {
                    displayFileMessage(msg, isOwn);
                } else {
                    displayMessage(msg, isOwn);
                }
            };

            chat.onUserUpdate = (userList) => {
                users = userList || [];
                updateUserList(users);
                const count = users.filter(u => u !== chat.username).length;
                document.getElementById('chat-title').textContent = `💬 Room (${count} online)`;
            };

            chat.onConnectionChange = (connected) => {
                if (connected) {
                    connStatus.textContent = '🟢';
                    connStatus.className = 'connection-status connected';
                    document.getElementById('connection-status').textContent = '🟢 Connected';
                    document.getElementById('connection-status').style.color = '#00ff88';
                    document.getElementById('server-status').textContent = '✅ Connected';
                    document.getElementById('server-status').style.color = '#00ff88';
                } else {
                    connStatus.textContent = '🔴';
                    connStatus.className = 'connection-status disconnected';
                    document.getElementById('connection-status').textContent = '🔴 Disconnected';
                    document.getElementById('connection-status').style.color = '#ff4444';
                    document.getElementById('server-status').textContent = '❌ Disconnected';
                    document.getElementById('server-status').style.color = '#ff4444';
                }
            };

            chat.onTyping = (username, isTyping) => {
                if (isTyping && username !== chat.username) {
                    typingIndicator.textContent = `${username} is typing...`;
                } else {
                    typingIndicator.textContent = '';
                }
            };

            // ---- CREATE ROOM ----
            createBtn.addEventListener('click', async () => {
                const username = document.getElementById('create-username').value.trim();
                if (!username) { alert('Please enter a username'); return; }

                createBtn.disabled = true;
                createBtn.textContent = 'Creating...';

                try {
                    const roomInfo = await chat.createRoom(username);
                    setupScreen.classList.remove('active');
                    chatScreen.classList.add('active');
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    fileBtn.disabled = false;

                    const info = `Room ID: ${roomInfo.roomId}\nEncryption Key: ${roomInfo.encryptionKey}`;
                    navigator.clipboard.writeText(info).then(() => {
                        showSystemMessage('📋 Room info copied! Share with friends.');
                    });
                    showSystemMessage(`🚀 Room created! ID: ${roomInfo.roomId}`);

                } catch (error) {
                    alert('Failed: ' + error.message);
                } finally {
                    createBtn.disabled = false;
                    createBtn.textContent = 'Create Room';
                }
            });

            // ---- JOIN ROOM ----
            joinBtn.addEventListener('click', async () => {
                const roomId = document.getElementById('join-room-id').value.trim().toUpperCase();
                const username = document.getElementById('join-username').value.trim();

                if (!roomId || !username) {
                    alert('Please fill in all fields');
                    return;
                }

                const key = prompt('Enter the encryption key:');
                if (!key) return;

                joinBtn.disabled = true;
                joinBtn.textContent = 'Joining...';

                try {
                    await chat.joinRoom(roomId, username, key);
                    setupScreen.classList.remove('active');
                    chatScreen.classList.add('active');
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    fileBtn.disabled = false;
                    showSystemMessage('🔗 Joined the room!');

                } catch (error) {
                    alert('Failed: ' + error.message);
                } finally {
                    joinBtn.disabled = false;
                    joinBtn.textContent = 'Join Room';
                }
            });

            // ---- SEND ----
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            let typingTimer = null;
            messageInput.addEventListener('input', () => {
                clearTimeout(typingTimer);
                chat.sendTyping(true);
                typingTimer = setTimeout(() => {
                    chat.sendTyping(false);
                }, 1000);
            });

            async function sendMessage() {
                const text = messageInput.value.trim();
                if (!text) return;

                try {
                    if (isPrivateMode && privateTarget) {
                        await chat.sendMessage(text, true, privateTarget);
                    } else {
                        await chat.sendMessage(text);
                    }
                    messageInput.value = '';
                } catch (error) {
                    console.error('Send error:', error);
                }
            }

            // ---- FILE SHARING ----
            fileBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;

                for (const file of files) {
                    try {
                        if (isPrivateMode && privateTarget) {
                            await chat.sendFile(file, true, privateTarget);
                        } else {
                            await chat.sendFile(file);
                        }
                        showSystemMessage(`📎 Sent: ${file.name} (${(file.size/1024).toFixed(1)} KB)`);
                    } catch (error) {
                        console.error('File send error:', error);
                        showSystemMessage('❌ Failed to send file: ' + error.message);
                    }
                }
                fileInput.value = '';
            });

            // ---- PRIVATE TOGGLE ----
            privateToggle.addEventListener('click', () => {
                const onlineUsers = users.filter(u => u !== chat.username);
                if (onlineUsers.length === 0) {
                    alert('No other users online');
                    return;
                }

                if (!isPrivateMode) {
                    const target = prompt('Send private to:\n' + onlineUsers.join(', '));
                    if (target && onlineUsers.includes(target)) {
                        privateTarget = target;
                        isPrivateMode = true;
                        privateToggle.classList.add('active');
                        privateToggle.textContent = `🔒 ${target}`;
                        showSystemMessage(`🔒 Private chat with ${target}`);
                    } else if (target) {
                        alert('User not online');
                    }
                } else {
                    isPrivateMode = false;
                    privateTarget = null;
                    privateToggle.classList.remove('active');
                    privateToggle.textContent = '🔒';
                    showSystemMessage('🔓 Switched to public chat');
                }
            });

            // ---- LEAVE ----
            leaveBtn.addEventListener('click', () => {
                if (confirm('Leave the room?')) {
                    chat.leave();
                    chatScreen.classList.remove('active');
                    setupScreen.classList.add('active');
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                    fileBtn.disabled = true;
                    messagesDiv.innerHTML = '';
                    showSystemMessage('You left the room');
                }
            });

            // ---- UI HELPERS ----
            function displayMessage(msg, isOwn) {
                // Remove system message if present
                if (messagesDiv.children.length === 1 &&
                    messagesDiv.children[0].classList.contains('system-message') &&
                    messagesDiv.children[0].textContent.includes('Waiting')) {
                    messagesDiv.innerHTML = '';
                }

                const msgElement = document.createElement('div');
                const isPrivate = msg.isPrivate || false;
                msgElement.className = `message ${isOwn ? 'own' : 'other'} ${isPrivate ? 'private' : ''}`;
                
                const privateBadge = isPrivate ? '<span class="private-badge">🔒 Private</span>' : '';
                const targetInfo = msg.targetUser && msg.targetUser !== msg.sender ? ` → ${msg.targetUser}` : '';
                
                msgElement.innerHTML = `
                    <span class="sender-name">${msg.sender}${targetInfo} ${privateBadge}</span>
                    <span>${msg.message}</span>
                    <span class="timestamp">${new Date(msg.timestamp || Date.now()).toLocaleTimeString()}</span>
                `;
                messagesDiv.appendChild(msgElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                // Limit messages
                while (messagesDiv.children.length > 200) {
                    messagesDiv.removeChild(messagesDiv.children[0]);
                }
            }

            function displayFileMessage(msg, isOwn) {
                if (messagesDiv.children.length === 1 &&
                    messagesDiv.children[0].classList.contains('system-message') &&
                    messagesDiv.children[0].textContent.includes('Waiting')) {
                    messagesDiv.innerHTML = '';
                }

                const isPrivate = msg.isPrivate || false;
                const fileSize = msg.fileSize ? 
                    (msg.fileSize > 1024 * 1024 ? 
                        (msg.fileSize / (1024 * 1024)).toFixed(1) + ' MB' : 
                        (msg.fileSize / 1024).toFixed(1) + ' KB') 
                    : 'Unknown size';
                
                // Determine file icon based on type
                let fileIcon = '📁';
                if (msg.fileType) {
                    if (msg.fileType.startsWith('image/')) fileIcon = '🖼️';
                    else if (msg.fileType.startsWith('video/')) fileIcon = '🎬';
                    else if (msg.fileType.startsWith('audio/')) fileIcon = '🎵';
                    else if (msg.fileType.includes('pdf')) fileIcon = '📄';
                    else if (msg.fileType.includes('zip') || msg.fileType.includes('rar')) fileIcon = '📦';
                }

                const msgElement = document.createElement('div');
                msgElement.className = `message ${isOwn ? 'own' : 'other'} ${isPrivate ? 'private' : ''}`;
                
                const privateBadge = isPrivate ? '<span class="private-badge">🔒 Private</span>' : '';
                const targetInfo = msg.targetUser && msg.targetUser !== msg.sender ? ` → ${msg.targetUser}` : '';
                
                // Store file data reference
                const fileId = msg.id || Date.now().toString(36);
                if (msg.fileData) {
                    window._fileData = window._fileData || {};
                    window._fileData[fileId] = msg;
                }
                
                msgElement.innerHTML = `
                    <span class="sender-name">${msg.sender}${targetInfo} ${privateBadge}</span>
                    <div>
                        <span class="file-attachment" onclick="window.downloadFile('${fileId}')">
                            <span class="file-icon">${fileIcon}</span>
                            <span class="file-name">${msg.fileName || 'file'}</span>
                            <span class="file-size">(${fileSize})</span>
                        </span>
                    </div>
                    <span class="timestamp">${new Date(msg.timestamp || Date.now()).toLocaleTimeString()}</span>
                `;
                messagesDiv.appendChild(msgElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                while (messagesDiv.children.length > 200) {
                    messagesDiv.removeChild(messagesDiv.children[0]);
                }
            }

            // Global download function
            window.downloadFile = function(id) {
                if (window._fileData && window._fileData[id]) {
                    chat.downloadFile(window._fileData[id]);
                } else {
                    alert('File data not available. It may have been cleared from memory.');
                }
            };

            function showSystemMessage(text) {
                const msgElement = document.createElement('div');
                msgElement.className = 'system-message';
                msgElement.textContent = text;
                messagesDiv.appendChild(msgElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function updateUserList(users) {
                const currentUser = chat.username;
                let html = users.map(u => `
                    <span class="user-chip">
                        <span class="online-dot"></span>
                        ${u} ${u === currentUser ? '(You)' : ''}
                    </span>
                `).join('');
                userList.innerHTML = html || '<span style="color:#556;font-size:11px;">No users online</span>';
            }

            console.log('💬 Secure Chat loaded!');
            console.log(`📡 Server: ${serverUrl}`);
            console.log('🔒 Messages are end-to-end encrypted');
            console.log('📎 File sharing enabled - click 📎 to send files');
        });
    </script>

</body>
</html>
