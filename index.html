<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💬 Secure Chat</title>
    <style>
        /* ... (all previous styles) ... */
        .message {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn .25s ease;
            font-size: 14px;
            position: relative;
            cursor: default;
            transition: all 0.3s;
        }
        .message:hover {
            filter: brightness(1.05);
        }
        .message .delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 68, 68, 0.9);
            border: none;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            line-height: 1;
        }
        .message:hover .delete-btn {
            display: flex;
        }
        .message .delete-btn:hover {
            transform: scale(1.2);
            background: #ff4444;
        }
        .message.deleted {
            opacity: 0.4;
            text-decoration: line-through;
            pointer-events: none;
        }
        .message.deleted .delete-btn {
            display: none !important;
        }
        .message.deleted .sender-name::after {
            content: " (deleted)";
            color: #ff4444;
            font-size: 10px;
            opacity: 0.7;
        }
        .message.deleted .timestamp::after {
            content: " 🗑️";
        }
        .context-menu {
            display: none;
            position: fixed;
            background: rgba(20, 27, 43, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 0;
            min-width: 150px;
            z-index: 1001;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }
        .context-menu.active {
            display: block;
        }
        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            color: #e0e0e0;
        }
        .context-menu-item:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        .context-menu-item.danger {
            color: #ff4444;
        }
        .context-menu-item.danger:hover {
            background: rgba(255, 68, 68, 0.1);
        }
        .context-menu-item .icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- ... same HTML structure ... -->
    
    <!-- CONTEXT MENU -->
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item danger" id="delete-msg-btn">
            <span class="icon">🗑️</span> Delete for me
        </div>
    </div>

    <script>
        // ... encryption class (same) ...

        // ============================================================
        //  CHAT CLIENT - WITH DELETE SUPPORT
        // ============================================================
        class SecureChat {
            constructor(serverUrl) {
                // ... same properties ...
                this.deletedMessageIds = new Set(); // Track locally deleted messages
            }

            // ... all previous methods ...

            // ===== NEW: Delete a single message =====
            deleteMessage(messageId, isPrivate = false, targetUser = null) {
                this.ws.send(JSON.stringify({
                    type: 'delete-message',
                    messageId: messageId,
                    isPrivate: isPrivate,
                    targetUser: targetUser
                }));
                
                // Mark as deleted locally
                this.deletedMessageIds.add(messageId);
                
                // Remove from chat UI
                this.removeMessageFromChat(messageId);
            }

            // ===== NEW: Clear entire chat =====
            clearChat(chatId) {
                const isPrivate = chatId.startsWith('private_');
                const targetUser = isPrivate ? chatId.replace('private_', '') : null;
                
                this.ws.send(JSON.stringify({
                    type: 'clear-chat',
                    chatType: isPrivate ? 'private' : 'public',
                    targetUser: targetUser
                }));
                
                // Clear locally
                if (this.chats[chatId]) {
                    // Mark all messages as deleted
                    for (const msg of this.chats[chatId].messages) {
                        this.deletedMessageIds.add(msg.id);
                    }
                    this.chats[chatId].messages = [];
                    this.chats[chatId].lastMessage = null;
                    this.chats[chatId].lastTime = 0;
                    this.chats[chatId].unread = 0;
                    this.saveSession();
                    if (this.onChatUpdate) this.onChatUpdate(this.getChatList());
                }
            }

            // ===== NEW: Remove a message from chat =====
            removeMessageFromChat(messageId) {
                for (const [chatId, chat] of Object.entries(this.chats)) {
                    const index = chat.messages.findIndex(m => m.id === messageId);
                    if (index !== -1) {
                        // Remove from messages array
                        chat.messages.splice(index, 1);
                        // Update last message if needed
                        if (chat.messages.length > 0) {
                            const last = chat.messages[chat.messages.length - 1];
                            chat.lastMessage = last.message || (last.fileName ? `📎 ${last.fileName}` : '');
                            chat.lastTime = last.timestamp || Date.now();
                        } else {
                            chat.lastMessage = null;
                            chat.lastTime = 0;
                        }
                        this.saveSession();
                        if (this.onChatUpdate) this.onChatUpdate(this.getChatList());
                        break;
                    }
                }
            }

            // ===== NEW: Handle message deletion from server =====
            handleMessageDeleted(messageId) {
                this.deletedMessageIds.add(messageId);
                this.removeMessageFromChat(messageId);
            }

            // ===== NEW: Handle chat cleared from server =====
            handleChatCleared(chatId) {
                if (this.chats[chatId]) {
                    this.chats[chatId].messages = [];
                    this.chats[chatId].lastMessage = null;
                    this.chats[chatId].lastTime = 0;
                    this.chats[chatId].unread = 0;
                    this.saveSession();
                    if (this.onChatUpdate) this.onChatUpdate(this.getChatList());
                }
            }

            // ... override handleMessage to support delete events ...
            async handleMessage(data) {
                console.log(`📨 Received: ${data.type}`);

                switch (data.type) {
                    case 'history':
                        for (const msg of data.messages) {
                            if (this.processedIds.has(msg.id) || this.deletedMessageIds.has(msg.id)) continue;
                            this.processedIds.add(msg.id);
                            
                            const chatId = this.getChatId('room', false);
                            const decrypted = await this.encryption.decrypt(msg.message);
                            msg.message = decrypted;
                            
                            if (msg.sender !== this.username) {
                                this.addMessageToChat(chatId, msg, false);
                                if (this.onMessage) {
                                    this.onMessage(msg, false, chatId);
                                }
                            }
                        }
                        this.saveSession();
                        if (this.onChatUpdate) this.onChatUpdate(this.getChatList());
                        break;

                    // ... other cases ...

                    case 'message-deleted':
                        this.handleMessageDeleted(data.messageId);
                        if (this.onMessageDeleted) {
                            this.onMessageDeleted(data.messageId);
                        }
                        break;

                    case 'chat-cleared':
                        this.handleChatCleared(data.chatId);
                        if (this.onChatCleared) {
                            this.onChatCleared(data.chatId);
                        }
                        break;

                    // ... rest of cases ...
                }
            }
        }

        // ============================================================
        //  UI CONTROLLER - WITH CONTEXT MENU
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // ... previous setup ...

            // ===== CONTEXT MENU =====
            const contextMenu = document.getElementById('context-menu');
            const deleteBtn = document.getElementById('delete-msg-btn');
            let selectedMessageId = null;
            let selectedMessageIsPrivate = false;
            let selectedMessageTarget = null;

            // Show context menu on right-click
            document.addEventListener('contextmenu', (e) => {
                const messageEl = e.target.closest('.message');
                if (!messageEl) {
                    contextMenu.classList.remove('active');
                    return;
                }
                
                e.preventDefault();
                selectedMessageId = messageEl.dataset.msgId;
                selectedMessageIsPrivate = messageEl.dataset.isPrivate === 'true';
                selectedMessageTarget = messageEl.dataset.targetUser || null;
                
                contextMenu.style.left = e.clientX + 'px';
                contextMenu.style.top = e.clientY + 'px';
                contextMenu.classList.add('active');
            });

            // Hide context menu on click elsewhere
            document.addEventListener('click', () => {
                contextMenu.classList.remove('active');
            });

            // Delete message
            deleteBtn.addEventListener('click', () => {
                if (selectedMessageId) {
                    if (confirm('Delete this message?')) {
                        chat.deleteMessage(selectedMessageId, selectedMessageIsPrivate, selectedMessageTarget);
                    }
                }
                contextMenu.classList.remove('active');
            });

            // ===== CLEAR CHAT - Updated =====
            clearChatBtn.addEventListener('click', () => {
                if (!currentChatId) return;
                if (confirm('Clear all messages in this chat? This cannot be undone.')) {
                    chat.clearChat(currentChatId);
                    messagesDiv.innerHTML = '';
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'system-message';
                    emptyMsg.textContent = '💬 Chat cleared permanently';
                    messagesDiv.appendChild(emptyMsg);
                    renderChatList();
                    showSystemMessage('🗑️ Chat cleared permanently');
                }
            });

            // ===== DISPLAY MESSAGE - With delete button =====
            function displayMessage(msg, isOwn) {
                // ... previous code ...
                
                const msgElement = document.createElement('div');
                msgElement.className = `message ${isOwn ? 'own' : 'other'}`;
                msgElement.dataset.msgId = msg.id || Date.now().toString(36);
                msgElement.dataset.isPrivate = msg.isPrivate || false;
                msgElement.dataset.targetUser = msg.targetUser || '';
                
                // Check if message is deleted
                if (chat.deletedMessageIds.has(msg.id)) {
                    msgElement.classList.add('deleted');
                }
                
                // ... rest of message rendering ...
                
                // Add delete button for own messages
                if (isOwn) {
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = '×';
                    deleteBtn.title = 'Delete message';
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Delete this message?')) {
                            chat.deleteMessage(msg.id, msg.isPrivate || false, msg.targetUser || null);
                        }
                    });
                    msgElement.appendChild(deleteBtn);
                }
                
                messagesDiv.appendChild(msgElement);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            // ===== HANDLE MESSAGE DELETED =====
            chat.onMessageDeleted = (messageId) => {
                // Remove the message from UI
                const msgElement = messagesDiv.querySelector(`[data-msg-id="${messageId}"]`);
                if (msgElement) {
                    msgElement.classList.add('deleted');
                    // Remove after animation
                    setTimeout(() => {
                        if (msgElement.parentNode) {
                            msgElement.remove();
                        }
                    }, 300);
                }
            };

            chat.onChatCleared = (chatId) => {
                if (chatId === currentChatId) {
                    messagesDiv.innerHTML = '';
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'system-message';
                    emptyMsg.textContent = '💬 Chat has been cleared';
                    messagesDiv.appendChild(emptyMsg);
                }
            };

            // ... rest of UI controller ...
        });
    </script>
</body>
</html>
